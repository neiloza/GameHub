<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f9d5b"/>
      <stop offset="1" stop-color="#1f6b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#eaffe0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#eaffe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7e88a"/>
      <stop offset="1" stop-color="#5cbf62"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (overscan a few px past the edges) -->
  <rect x="-8" y="-8" width="528" height="528" fill="url(#bg)"/>
  <rect x="-8" y="-8" width="528" height="528" fill="url(#glow)"/>

  <!-- soft ground shadow -->
  <ellipse cx="256" cy="418" rx="132" ry="22" fill="#134b28" opacity="0.32"/>

  <!-- trunk -->
  <rect x="236" y="378" width="40" height="46" rx="11" fill="#7a5533"/>

  <!-- coniferous (Christmas-tree) canopy: full, layered, vibrant greens -->
  <g>
    <path d="M256 232 L120 388 Q256 344 392 388 Z" fill="url(#leaf)"/>
    <path d="M256 232 L120 388 Q256 344 256 388 Z" fill="#4bae56" opacity="0.32"/>

    <path d="M256 156 L142 308 Q256 268 370 308 Z" fill="url(#leaf)"/>
    <path d="M256 156 L142 308 Q256 268 256 308 Z" fill="#4bae56" opacity="0.32"/>

    <path d="M256 92 L164 226 Q256 190 348 226 Z" fill="url(#leaf)"/>
    <path d="M256 92 L164 226 Q256 190 256 226 Z" fill="#4bae56" opacity="0.32"/>

    <path d="M256 48 L188 158 Q256 128 324 158 Z" fill="#c2f0a8"/>
    <path d="M256 48 L188 158 Q256 128 256 158 Z" fill="#8fda88" opacity="0.4"/>
  </g>

  <!-- star / bud at the top -->
  <circle cx="256" cy="52" r="11" fill="#fbffe8"/>
</svg>
