<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Number Recall — remember a growing sequence of digits.">
<title>Number Recall — GameHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game.css">
<style>
  .display {
    height: 180px;
    border-radius: var(--radius);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    font-weight: 800;
    color: var(--accent-2);
    margin-bottom: 1.25rem;
    letter-spacing: 0.05em;
  }
  .entry-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .entry-chip {
    min-width: 42px;
    padding: 0.5rem 0.7rem;
    text-align: center;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-weight: 700;
  }
  .entry-chip.correct { border-color: #1fa855; color: #1fa855; }
  .entry-chip.wrong { border-color: #c0392b; color: #c0392b; }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
    max-width: 300px;
  }
  .key {
    padding: 1rem;
    font-size: 1.3rem;
    font-weight: 700;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    color: var(--text);
  }
  .key:hover { border-color: var(--accent); }
  .key.wide { grid-column: span 1; }
</style>
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a href="../../index.html" class="game-back">&larr; Back to Hub</a>
      <div class="game-title">🔢 Number Recall</div>
    </div>
    <p class="game-tagline">Watch the digits flash one by one, then type them back in the same order. Choose how long a sequence you want to take on.</p>

    <div class="panel" id="setupPanel">
      <div class="field-label">Sequence Length</div>
      <div class="difficulty-select" id="diffSelect"></div>
      <div class="btn-row">
        <button class="btn-action" id="startBtn">Start</button>
      </div>
    </div>

    <div class="panel hidden" id="gamePanel">
      <div class="stat-row">
        <div class="stat-block"><span class="big-stat" id="stat-length">0</span><span class="stat-label">Length</span></div>
        <div class="stat-block"><span class="big-stat" id="stat-progress">0/0</span><span class="stat-label">Entered</span></div>
      </div>
      <p class="game-message" id="gameMessage">Watch closely...</p>
      <div class="display" id="display"></div>
      <div class="entry-row" id="entryRow"></div>
      <div class="keypad hidden" id="keypad"></div>
    </div>

    <div class="panel hidden" id="overPanel">
      <h3 style="margin-bottom:0.5rem;" id="overTitle">Result</h3>
      <p class="game-message" id="overMessage"></p>
      <div class="btn-row">
        <button class="btn-action" id="againBtn">Play Again</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const diffSelect = document.getElementById("diffSelect");
  const setupPanel = document.getElementById("setupPanel");
  const gamePanel = document.getElementById("gamePanel");
  const overPanel = document.getElementById("overPanel");
  const startBtn = document.getElementById("startBtn");
  const againBtn = document.getElementById("againBtn");
  const display = document.getElementById("display");
  const entryRow = document.getElementById("entryRow");
  const keypad = document.getElementById("keypad");
  const gameMessage = document.getElementById("gameMessage");
  const statLength = document.getElementById("stat-length");
  const statProgress = document.getElementById("stat-progress");
  const overTitle = document.getElementById("overTitle");
  const overMessage = document.getElementById("overMessage");

  const LENGTHS = [5, 10, 15, 20, 25];
  let length = 5;
  let sequence = [];
  let entered = [];
  let phase = "idle";

  LENGTHS.forEach((n) => {
    const btn = document.createElement("button");
    btn.className = "diff-btn" + (n === length ? " active" : "");
    btn.textContent = n;
    btn.addEventListener("click", () => {
      length = n;
      [...diffSelect.children].forEach((c) => c.classList.remove("active"));
      btn.classList.add("active");
    });
    diffSelect.appendChild(btn);
  });

  for (let d = 0; d <= 9; d++) {
    const key = document.createElement("button");
    key.className = "key";
    key.textContent = d;
    key.addEventListener("click", () => handleDigit(d));
    if (d === 0) key.style.gridColumn = "2";
    keypad.appendChild(key);
  }
  // reorder so 0 sits at the bottom center; rebuild properly
  keypad.innerHTML = "";
  const rows = [[1, 2, 3], [4, 5, 6], [7, 8, 9], [null, 0, null]];
  rows.flat().forEach((d) => {
    const key = document.createElement("button");
    if (d === null) {
      key.style.visibility = "hidden";
      key.className = "key";
    } else {
      key.className = "key";
      key.textContent = d;
      key.addEventListener("click", () => handleDigit(d));
    }
    keypad.appendChild(key);
  });

  function beginGame() {
    setupPanel.classList.add("hidden");
    overPanel.classList.add("hidden");
    gamePanel.classList.remove("hidden");
    keypad.classList.add("hidden");
    entered = [];
    entryRow.innerHTML = "";
    sequence = Array.from({ length }, () => Math.floor(Math.random() * 10));
    statLength.textContent = length;
    statProgress.textContent = `0/${length}`;
    gameMessage.textContent = "Watch closely...";
    display.textContent = "";
    phase = "showing";
    showSequence();
  }

  function showSequence() {
    let i = 0;
    const perDigit = Math.max(450, 750 - length * 8);
    const interval = setInterval(() => {
      if (i >= sequence.length) {
        clearInterval(interval);
        display.textContent = "?";
        gameMessage.textContent = "Now type the sequence back, in order.";
        phase = "entering";
        keypad.classList.remove("hidden");
        return;
      }
      display.textContent = sequence[i];
      i++;
    }, perDigit);
  }

  function handleDigit(d) {
    if (phase !== "entering") return;
    const idx = entered.length;
    entered.push(d);
    const chip = document.createElement("div");
    chip.className = "entry-chip";
    chip.textContent = d;
    const isCorrect = sequence[idx] === d;
    chip.classList.add(isCorrect ? "correct" : "wrong");
    entryRow.appendChild(chip);
    statProgress.textContent = `${entered.length}/${length}`;

    if (!isCorrect) {
      finish(false, idx);
      return;
    }
    if (entered.length === sequence.length) {
      finish(true, sequence.length);
    }
  }

  function finish(success, correctCount) {
    phase = "idle";
    gamePanel.classList.add("hidden");
    overPanel.classList.remove("hidden");
    if (success) {
      overTitle.textContent = "Nailed it!";
      overMessage.textContent = `You recalled all ${length} digits correctly.`;
    } else {
      overTitle.textContent = "Sequence broken";
      overMessage.textContent = `You got ${correctCount} of ${length} digits right before a mistake.`;
    }
  }

  function resetToSetup() {
    overPanel.classList.add("hidden");
    setupPanel.classList.remove("hidden");
  }

  startBtn.addEventListener("click", beginGame);
  againBtn.addEventListener("click", resetToSetup);
})();
</script>
</body>
</html>
