<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Reaction Speed — tap the moment it turns green.">
<title>Reaction Speed — GameHub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/game.css">
<style>
  .pad {
    height: 340px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 800;
    color: #fff;
    user-select: none;
    cursor: pointer;
    text-align: center;
    padding: 1rem;
    transition: background 0.05s;
  }
  .pad.idle { background: var(--bg-raised); color: var(--text-dim); border: 1px solid var(--border); }
  .pad.wait { background: #c0392b; }
  .pad.go   { background: #1fa855; }
  .pad.early{ background: #8c2f2f; }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 0.75rem;
    margin: 1rem 0;
  }
  .round-chip {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem;
    text-align: center;
    font-weight: 700;
  }
  .round-chip.bad { color: #ff6b6b; }
</style>
</head>
<body>
  <div class="game-shell">
    <div class="game-topbar">
      <a href="../../index.html" class="game-back">&larr; Back to Hub</a>
      <div class="game-title">⚡ Reaction Speed</div>
    </div>
    <p class="game-tagline">Wait for red to turn green, then tap as fast as you can. Tap too early and you'll false-start. Five rounds, best average wins.</p>

    <div class="panel">
      <div class="stat-row">
        <div class="stat-block"><span class="big-stat" id="stat-round">0/5</span><span class="stat-label">Round</span></div>
        <div class="stat-block"><span class="big-stat" id="stat-last">—</span><span class="stat-label">Last (ms)</span></div>
        <div class="stat-block"><span class="big-stat" id="stat-best">—</span><span class="stat-label">Best (ms)</span></div>
      </div>

      <div class="pad idle" id="pad">Tap Start to begin</div>

      <div class="btn-row">
        <button class="btn-action" id="startBtn">Start</button>
      </div>
    </div>

    <div class="panel hidden" id="summaryPanel">
      <h3 style="margin-bottom:0.75rem;">Results</h3>
      <div class="results-grid" id="resultsGrid"></div>
      <p class="game-message" id="summaryMessage"></p>
      <div class="btn-row">
        <button class="btn-action" id="againBtn">Play Again</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const pad = document.getElementById("pad");
  const startBtn = document.getElementById("startBtn");
  const againBtn = document.getElementById("againBtn");
  const statRound = document.getElementById("stat-round");
  const statLast = document.getElementById("stat-last");
  const statBest = document.getElementById("stat-best");
  const summaryPanel = document.getElementById("summaryPanel");
  const resultsGrid = document.getElementById("resultsGrid");
  const summaryMessage = document.getElementById("summaryMessage");

  const TOTAL_ROUNDS = 5;
  let round = 0;
  let results = [];
  let state = "idle"; // idle | waiting | ready | early
  let timerId = null;
  let goTime = 0;

  function reset() {
    round = 0;
    results = [];
    state = "idle";
    statRound.textContent = `0/${TOTAL_ROUNDS}`;
    statLast.textContent = "—";
    statBest.textContent = "—";
    summaryPanel.classList.add("hidden");
    setPad("idle", "Tap Start to begin");
    startBtn.disabled = false;
  }

  function setPad(cls, text) {
    pad.className = `pad ${cls}`;
    pad.textContent = text;
  }

  function startRound() {
    if (round >= TOTAL_ROUNDS) return finish();
    state = "waiting";
    setPad("wait", "Wait for green...");
    const delay = 1000 + Math.random() * 3000;
    timerId = setTimeout(() => {
      state = "ready";
      goTime = performance.now();
      setPad("go", "TAP NOW!");
    }, delay);
  }

  function finish() {
    setPad("idle", "All done — see your results below");
    startBtn.disabled = true;
    summaryPanel.classList.remove("hidden");
    resultsGrid.innerHTML = results
      .map((r, i) =>
        r === null
          ? `<div class="round-chip bad">R${i + 1}<br>False start</div>`
          : `<div class="round-chip">R${i + 1}<br>${r} ms</div>`
      )
      .join("");
    const valid = results.filter((r) => r !== null);
    if (valid.length === 0) {
      summaryMessage.textContent = "No valid taps — try waiting for green next time!";
    } else {
      const avg = Math.round(valid.reduce((a, b) => a + b, 0) / valid.length);
      summaryMessage.textContent = `Average reaction time: ${avg} ms across ${valid.length} valid round(s).`;
    }
  }

  function handlePadClick() {
    if (state === "waiting") {
      clearTimeout(timerId);
      state = "early";
      setPad("early", "Too soon! Tap to continue");
      results.push(null);
      round++;
      statRound.textContent = `${round}/${TOTAL_ROUNDS}`;
      statLast.textContent = "Early";
      setTimeout(() => {
        if (round < TOTAL_ROUNDS) startRound();
        else finish();
      }, 900);
    } else if (state === "ready") {
      const rt = Math.round(performance.now() - goTime);
      results.push(rt);
      round++;
      statRound.textContent = `${round}/${TOTAL_ROUNDS}`;
      statLast.textContent = rt;
      const best = Math.min(...results.filter((r) => r !== null));
      if (isFinite(best)) statBest.textContent = best;
      setPad("idle", `${rt} ms — nice! Get ready...`);
      state = "idle";
      setTimeout(() => {
        if (round < TOTAL_ROUNDS) startRound();
        else finish();
      }, 900);
    }
  }

  pad.addEventListener("click", handlePadClick);
  startBtn.addEventListener("click", () => {
    startBtn.disabled = true;
    startRound();
  });
  againBtn.addEventListener("click", reset);

  reset();
})();
</script>
</body>
</html>
